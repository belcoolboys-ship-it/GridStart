<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StartGrid — регистрация на гонки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0F1316;--card:#171C20;--in:#11161A;--line:#2A3238;--tx:#E9EEF0;--mut:#8C999F;--acc:#F0444C;--ok:#3ecf72;--asph:#0A0D10;
--disp:Unbounded,"Arial Black",system-ui,sans-serif;--body:Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 var(--body)}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.top{background:var(--asph);color:#F2F4F3;position:sticky;top:0;z-index:30;box-shadow:0 1px 0 var(--line)}
.top:after{content:"";display:block;height:5px;background:repeating-linear-gradient(90deg,var(--acc) 0 22px,#F2F4F3 22px 44px)}
header{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:13px 0}
.logo{font-family:var(--disp);font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none}
nav{display:flex;gap:22px;flex:1}
nav a{color:var(--mut);text-decoration:none;padding:6px 0;border-bottom:2px solid transparent;font-weight:500}
nav a:hover{color:#fff}
nav a.on{color:#fff;border-color:var(--acc)}
.btn{border:1px solid var(--acc);border-radius:4px;padding:10px 18px;font:600 15px var(--body);cursor:pointer;background:var(--acc);color:#fff;text-decoration:none;display:inline-block;transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn.g{background:transparent;color:var(--tx);border-color:var(--line)}
.btn.g:hover{border-color:var(--mut)}
.btn.s{padding:5px 11px;font-size:13px;font-weight:500}
h1,h2,h3{font-family:var(--disp);margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:clamp(26px,4.6vw,44px);line-height:1.1}
h2{font-size:19px;line-height:1.25}
.lead{font-size:17px;color:var(--mut);max-width:46ch;margin:14px 0 0}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px}
.p0{padding:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:30px;align-items:start}
.cols.gate{align-items:center;margin-top:34px;min-height:60vh}
.tag{display:inline-block;font:700 12px var(--disp);padding:4px 9px;border-radius:3px;background:var(--acc);color:#fff;letter-spacing:.04em}
.tag.lmu{background:#1B5FD1}
.tag.gray{background:var(--in);color:var(--mut);border:1px solid var(--line)}
.pill{display:inline-block;font-size:13px;font-weight:500;padding:3px 11px;border-radius:99px;border:1px solid var(--line);background:var(--in);color:var(--mut)}
.mut{color:var(--mut);font-size:14px}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
label{display:block;font-size:13.5px;font-weight:500;color:var(--mut);margin:0 0 5px}
input,select{width:100%;height:42px;padding:0 12px;border-radius:4px;border:1px solid var(--line);background:var(--in);color:var(--tx);font:inherit}
input:focus,select:focus{border-color:var(--mut)}
input:disabled{opacity:.6}
.f{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12.5px;font-weight:500;color:var(--mut);padding:11px 14px;border-bottom:1px solid var(--tx);text-transform:uppercase;letter-spacing:.05em}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--in)}
.pl{display:flex;align-items:center;gap:10px;font-weight:500}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:600;font-size:13px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.mini{display:inline-block;font:700 11px var(--disp);padding:1px 5px;border:1.5px solid currentColor;border-radius:2px;vertical-align:1px}
.pav{width:72px;height:72px;border-radius:50%;overflow:hidden;display:inline-grid;place-items:center;color:#fff;font:600 30px var(--body);flex:none}
.pav img{width:100%;height:100%;object-fit:cover}
.num{display:inline-block;min-width:34px;text-align:center;font:700 14px var(--disp);padding:3px 6px;border:2px solid var(--tx);border-radius:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:14px;color:var(--mut);font-weight:500}
.crumb{display:inline-block;color:var(--mut);cursor:pointer;margin-bottom:16px;text-decoration:underline;text-underline-offset:3px}
.next{padding:44px 0 34px;border-bottom:1px solid var(--tx);margin-bottom:10px}
.next h1{margin-top:14px}
.grp{display:flex;align-items:baseline;gap:12px;margin:34px 0 4px;padding-bottom:10px;border-bottom:1px solid var(--tx)}
.grp h3{font-size:15px}
.rrow{display:grid;grid-template-columns:62px minmax(0,1fr) 180px;gap:18px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rrow:hover .rn{text-decoration:underline;text-underline-offset:3px}
.db{text-align:center;line-height:1}
.db b{display:block;font:700 26px var(--disp)}
.db span{font-size:13px;color:var(--mut)}
.rn{font-weight:600;font-size:16px}
.rr{display:flex;align-items:center;gap:10px}
.rr .tag{flex:none}
.rr .fill{flex:1;min-width:0}
.cd{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.cd>div{background:var(--in);border:1px solid var(--line);border-radius:6px;min-width:74px;padding:10px 8px;text-align:center}
.cd b{display:block;font:700 26px/1.1 var(--disp)}
.cd i{font-style:normal;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.tl{list-style:none;margin:14px 0 0;padding:0 0 0 22px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 18px}
.tl li:last-child{padding-bottom:0}
.tl li:before{content:"";position:absolute;left:-29px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--mut)}
.tl li.past:before{background:var(--mut)}
.tl li:last-child:before{border-color:var(--acc);background:var(--acc)}
.tl b{display:block;font-weight:600}
.tl span{color:var(--mut);font-size:14px}
.tabs{display:flex;gap:26px;margin:30px 0 0;border-bottom:1px solid var(--line)}
.tabs a{padding:10px 0;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;user-select:none}
.tabs a:hover{color:var(--tx)}
.tabs a.on{color:var(--tx);border-color:var(--acc)}
.gv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px;padding:24px 20px 44px;background:var(--asph);border-radius:6px;border:1px solid var(--line)}
.slot{height:60px;display:flex;align-items:center;gap:12px;padding:0 14px;border:2px solid rgba(242,244,243,.4);border-radius:3px;color:#F2F4F3;min-width:0}
.slot:nth-child(even){margin-top:28px}
.slot.on{background:#F2F4F3;border-color:#F2F4F3;color:#171D21}
.slot b{font:700 18px var(--disp)}
.slot span{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot i{font-style:normal;font-size:13px;opacity:.55}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--in);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.stat b{display:block;font-size:16px;font-weight:600}
.lob{display:grid;gap:12px}
.lob b{font:700 22px var(--disp);display:block;margin:4px 0 10px;word-break:break-all}
.achv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.ach{border:1px solid var(--line);border-radius:6px;padding:12px 8px;text-align:center}
.ach.lock{opacity:.38;filter:grayscale(.8)}
.ach .ic{font-size:24px;display:block;margin-bottom:4px}
.ach b{display:block;font-size:13px;font-weight:600}
.ach span{font-size:12px;color:var(--mut)}
.phead{display:flex;gap:14px;align-items:center;min-width:0}
.menuw{position:relative}
.menu{display:none;position:absolute;right:0;top:calc(100% + 8px);min-width:220px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.menu.open{display:block}
.menu a{display:block;padding:10px 12px;border-radius:4px;cursor:pointer;font-weight:500}
.menu a:hover{background:var(--in)}
.modal{position:fixed;inset:0;background:rgba(5,7,9,.75);display:grid;place-items:center;padding:16px;z-index:50}
.modal .card{width:100%;max-width:400px;max-height:90vh;overflow:auto}
.modal .card.wide{max-width:640px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:4px;font-weight:500;z-index:60}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.steamav{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--in);flex:none}
footer{color:var(--mut);font-size:13px;padding:50px 0 40px}
@media (max-width:760px){
.wrap{padding:0 14px}
.cols,.next{grid-template-columns:minmax(0,1fr);gap:22px}
.rrow{grid-template-columns:52px minmax(0,1fr);gap:6px 14px}
.rrow .rr{grid-column:2}
header{gap:10px 16px}
nav{order:3;flex-basis:100%}
.gv{gap:10px 12px;padding:18px 12px 38px}
.slot{padding:0 10px;gap:8px}
.cd>div{min-width:62px;flex:1}
table{min-width:0}thead{display:none}
tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
tbody tr:last-child{border-bottom:0}
td{padding:0;border:0}
td:nth-child(4),td:nth-child(5){flex-basis:100%}
td:nth-child(5){color:var(--mut);font-size:13px}
td:last-child:not(:first-child){margin-left:auto}
.tabs a{flex:1;text-align:center}
}
</style>
</head>
<body>
<div class="top"><div class="wrap"><header>
  <div class="logo" onclick="location.hash=''"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="2" width="11" height="14" fill="none" stroke="#F2F4F3" stroke-width="2"/><rect x="15" y="9" width="11" height="14" fill="#F0444C"/></svg>StartGrid</div>
  <nav><a data-r="races" href="#">Гонки</a><a data-r="pilots" href="#pilots">Пилоты</a></nav>
  <div id="auth"></div>
</header></div></div>
<div class="wrap"><div id="app"></div><footer>© 2026 STARTGRID · Неофициальный сервис. Не связан с Kunos, Studio 397 и ACO.</footer></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
const PASS="mazai23";
const TRACKS={ACC:["Нюрбургринг","Монца","Спа","Ле-Ман","Сильверстоун","Зандворт","Имола","Мизано","Барселона","Хунгароринг","Поль-Рикар","Кьялами","Сузука","Уоткинс-Глен","КОТА","Брэндс-Хэтч"],LMU:["Ле-Ман","Спа","Монца","Фудзи","Себринг","Портиман","Имола","Барселона","КОТА","Сильверстоун"]};
const CARS={
ACC:{
"GT3 — топ":["BMW M4 GT3","Ford Mustang GT3","McLaren 720S GT3 Evo","Lamborghini Huracán GT3 Evo","Mercedes-AMG GT3 Evo (2020)","Audi R8 LMS Evo II","Honda NSX GT3 Evo (2019)","Ferrari 296 GT3","Porsche 992 GT3 R","Lamborghini Huracán GT3 EVO2"],
"GT3 — классика":["Aston Martin V8 Vantage GT3","Bentley Continental GT3 (2018)","Porsche 991 II GT3 R","Ferrari 488 GT3 Evo","Nissan GT-R Nismo GT3 (2018)","Lexus RC F GT3"],
"GT3 — 2015–2017":["Ferrari 488 GT3 (старая версия)","Lamborghini Huracán GT3 (2015)","Porsche 991 GT3 R","Audi R8 LMS","Mercedes-AMG GT3 (2015)","BMW M6 GT3","McLaren 650S GT3","Aston Martin V12 Vantage GT3","Nissan GT-R Nismo GT3 (2015)","Bentley Continental GT3 (2015)","Honda NSX GT3 (2017)","Reiter Engineering Gallardo R-EX","Emil Frey Jaguar G3"],
"GT4":["Alpine A110 GT4","Aston Martin Vantage GT4","Audi R8 LMS GT4","BMW M4 GT4","Chevrolet Camaro GT4.R","Ginetta G55 GT4","KTM X-Bow GT4","Maserati MC GT4","McLaren 570S GT4","Mercedes-AMG GT4","Porsche 718 Cayman GT4 MR"],
"Монокубки":["Porsche 991 II GT3 Cup","Lamborghini Huracán Super Trofeo","BMW M2 CS Racing (TCX)"]},
LMU:{
"Hypercar":["Toyota GR010 Hybrid","Porsche 963","BMW M Hybrid V8","Cadillac V-Series.R","Ferrari 499P","Peugeot 9X8 (2023)","Glickenhaus SCG 007","Vanwall Vandervell 680","Isotta Fraschini Tipo 6-C","Alpine A424","Aston Martin Valkyrie AMR LMH"],
"LMP2":["ORECA 07 Gibson","ORECA 07 Gibson (ELMS)"],
"LMP3":["Adess AD25"],
"LMGTE":["Porsche 911 RSR-19","Ferrari 488 GTE Evo","Chevrolet Corvette C8.R","Aston Martin Vantage GTE"],
"LMGT3":["McLaren 720S GT3 Evo","Ford Mustang GT3","Mercedes-AMG GT3","BMW M4 GT3","Ferrari 296 GT3","Porsche 911 GT3 R (992)","Lamborghini Huracán GT3 EVO2","Aston Martin Vantage GT3","Audi R8 LMS GT3 evo II","Chevrolet Corvette Z06 GT3.R"]}};
const FLAG={"Нюрбургринг":"🇩🇪","Монца":"🇮🇹","Спа":"🇧🇪","Ле-Ман":"🇫🇷","Сильверстоун":"🇬🇧","Фудзи":"🇯🇵","Зандворт":"🇳🇱","Имола":"🇮🇹","Мизано":"🇮🇹","Барселона":"🇪🇸","Хунгароринг":"🇭🇺","Поль-Рикар":"🇫🇷","Кьялами":"🇿🇦","Сузука":"🇯🇵","Уоткинс-Глен":"🇺🇸","КОТА":"🇺🇸","Брэндс-Хэтч":"🇬🇧","Себринг":"🇺🇸","Портиман":"🇵🇹"};
const MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const mem={races:{},entries:{},players:{},bans:{}};
let db=null,admin=null,uid=null,cuid=null,ready=false,gtab="reg";
try{admin=sessionStorage.getItem("sg_admin")}catch(e){}
try{const gt=sessionStorage.getItem("sg_gtab");if(gt)gtab=gt}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const e=$("#toast");e.innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>e.innerHTML="",2600)}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem("sg_data")||"null");if(d){mem.races=d.races||{};mem.entries=d.entries||{};mem.players=d.players||{};mem.bans=d.bans||{}}}catch(e){}}
function saveLocal(){try{localStorage.setItem("sg_data",JSON.stringify(mem))}catch(e){}}
function put(c,id,data){mem[c][id]=data;saveLocal();render();if(db)db.collection(c).doc(id).set(data).catch(()=>toast("Не удалось сохранить в общую базу"))}
function del(c,id,silent){delete mem[c][id];saveLocal();if(!silent)render();if(db)db.collection(c).doc(id).delete().catch(()=>{})}
async function init(){
  steamCallback();
  try{uid=localStorage.getItem("sg_pid")||null}catch(e){}
  loadLocal();render();
  try{
    if(window.claude&&claude.use){
      const u=await claude.use("user");
      if(u&&u.id)cuid=await u.id();
      db=await claude.use("db");
    }
  }catch(e){db=null}
  if(!cuid)cuid=localUid();
  if(db){["races","entries","players","bans"].forEach(c=>db.collection(c).onSnapshot(s=>{mem[c]={};s.docs.forEach(d=>mem[c][d.id]=d.data());if(c==="players")ready=true;render()},()=>{if(c==="players"){ready=true;render()}}))}
  else ready=true;
  render();
}
window.addEventListener("hashchange",render);
document.addEventListener("focusout",()=>setTimeout(()=>{if(pending)render()},50));
let pending=false;
function typing(){const a=document.activeElement;return a&&a.closest&&a.closest("#app")&&/INPUT|SELECT/.test(a.tagName)}
function render(){
  if(typing()){pending=true;return}
  pending=false;
  if(!ready){$("#auth").innerHTML="";$("#app").innerHTML='<div class="card mut">Загрузка…</div>';return}
  adopt();
  if(me()&&getPend())attachSteam(uid);
  const p=me();
  $("#auth").innerHTML=!p?"":'<div class="menuw"><button class="btn g" onclick="toggleMenu(event)"><span class="pl" style="display:inline-flex">'+avatarOf(p)+esc(p.nick)+' ▾</span></button><div class="menu" id="menu">'+(admin?'<a onclick="createModal()">＋ Создать гонку</a>':'')+'<a onclick="logout()">Выйти</a></div></div>';
  if(!p){gate();return}
  const b=banInfo(uid);
  if(b){$("#app").innerHTML=banScreen(b);return}
  const h=location.hash.slice(1);
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===(h==="pilots"?"pilots":"races")));
  if(h==="pilots")pilots();else if(h.startsWith("race-")&&mem.races[h.slice(5)])raceView(h.slice(5));else home();
}
setInterval(updateCountdown,1000);
document.addEventListener("click",()=>{const m=$("#menu");if(m)m.classList.remove("open")});
function localUid(){let u=null;try{u=localStorage.getItem("sg_uid");if(!u){u="u"+Math.random().toString(36).slice(2,10)+Date.now().toString(36);localStorage.setItem("sg_uid",u)}}catch(e){}return u||"guest"}
function me(){return uid?mem.players[uid]:null}
/* ---------- Обратный отсчёт ---------- */
function ts(d){return Date.parse(String(d||"").replace(" ","T")+":00+03:00")}
function cdLeft(r){const t=ts(r.date);if(isNaN(t))return null;let d=t-Date.now();if(d<0)d=0;const D=Math.floor(d/864e5),H=Math.floor(d%864e5/36e5),M=Math.floor(d%36e5/6e4),S=Math.floor(d%6e4/1e3);return{D:D,H:H,M:M,S:S,done:d===0}}
function cdHTML(r){const c=cdLeft(r);if(!c)return"";const cells=[["cd-d",c.D,"дней"],["cd-h",c.H,"часов"],["cd-m",c.M,"минут"],["cd-s",c.S,"секунд"]];return '<div class="cd">'+cells.map(x=>'<div><b id="'+x[0]+'">'+String(x[1]).padStart(2,"0")+'</b><i>'+x[2]+'</i></div>').join("")+'</div>'}
function updateCountdown(){if(!ready)return;const h=location.hash.slice(1);let r=null;if(h.startsWith("race-"))r=mem.races[h.slice(5)];else{const rs=Object.entries(mem.races).sort((a,b)=>String(a[1].date||"9").localeCompare(String(b[1].date||"9")));const now=Date.now();const up=rs.find(([i,x])=>ts(x.date)>now)||rs[0];if(up)r=up[1]}
  if(!r)return;const c=cdLeft(r);if(!c)return;const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=String(v).padStart(2,"0")};set("cd-d",c.D);set("cd-h",c.H);set("cd-m",c.M);set("cd-s",c.S)}
function whenShort(r){const c=cdLeft(r);if(!c)return"";if(c.done)return"Старт уже был";return"Старт через "+(c.D?c.D+" д "+c.H+" ч":c.H?c.H+" ч "+c.M+" мин":c.M+" мин")}
/* ---------- Steam ---------- */
function getPend(){try{return JSON.parse(sessionStorage.getItem("sg_steam_pending")||"null")}catch(e){return null}}
function setPend(p){try{sessionStorage.setItem("sg_steam_pending",JSON.stringify(p))}catch(e){}}
function clearPend(){try{sessionStorage.removeItem("sg_steam_pending")}catch(e){}render()}
function steamLogin(){
  const base=location.href.split("#")[0].split("?")[0];
  const ret=base+"?sgsteam=1";
  const p=new URLSearchParams({
    "openid.ns":"http://specs.openid.net/auth/2.0",
    "openid.mode":"checkid_setup",
    "openid.return_to":ret,
    "openid.realm":location.origin!=="null"?location.origin:base,
    "openid.identity":"http://specs.openid.net/auth/2.0/identifier_select",
    "openid.claimed_id":"http://specs.openid.net/auth/2.0/identifier_select"
  });
  location.href="https://steamcommunity.com/openid/login?"+p.toString();
}
function steamCallback(){

async function fetchSteam(url){
  const xml=url+"/?xml=1";
  const proxies=[
    function(u){return u},
    function(u){return "https://api.allorigins.win/raw?url="+encodeURIComponent(u)},
    function(u){return "https://corsproxy.io/?url="+encodeURIComponent(u)}
  ];
  for(let pi=0;pi<proxies.length;pi++){
    try{
      const r=await fetch(proxies[pi](xml));
      if(!r.ok)continue;
      const txt=await r.text();
      const nick=txt.match(/<steamID><!\[CDATA\[([^\]]+)\]\]><\/steamID>/)||txt.match(/<steamID>([^<]+)<\/steamID>/);
      if(nick&&nick[1]){
        const avm=txt.match(/<avatarFull><!\[CDATA\[([^\]]+)\]\]><\/avatarFull>/)||txt.match(/<avatarFull>([^<]+)<\/avatarFull>/)||txt.match(/<avatarMedium><!\[CDATA\[([^\]]+)\]\]><\/avatarMedium>/);
        const ms=txt.match(/<memberSince><!\[CDATA\[([^\]]+)\]\]><\/memberSince>/)||txt.match(/<memberSince>([^<]+)<\/memberSince>/);
        return{nick:nick[1].trim(),avatar:avm?avm[1].trim():"",memberSince:ms?ms[1].trim():""};
      }
    }catch(e){}
  }
  return null;
}
/* ---------- SHA-256 (с фолбэком без crypto.subtle) ---------- */
function sha256Sync(msg){
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var bytes=new TextEncoder().encode(msg);
  var bitlen=bytes.length*8;
  var padded=bytes.length+1;
  while(padded%64!==56)padded++;
  var buf=new Uint8Array(padded+8);
  buf.set(bytes);
  buf[bytes.length]=0x80;
  var dv=new DataView(buf.buffer);
  dv.setUint32(padded,Math.floor(bitlen/0x100000000),false);
  dv.setUint32(padded+4,bitlen>>>0,false);
  var w=new Array(64);
  for(var off=0;off<buf.length;off+=64){
    var i;
    for(i=0;i<16;i++)w[i]=dv.getUint32(off+i*4,false);
    for(i=16;i<64;i++){
      var x=w[i-15],y=w[i-2];
      var s0=((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3);
      var s1=((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    var a=h[0],b=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
    for(i=0;i<64;i++){
      var S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
      var ch=(e&f)^(~e&g);
      var t1=(hh+S1+ch+K[i]+w[i])|0;
      var S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
      var mj=(a&b)^(a&c)^(b&c);
      var t2=(S0+mj)|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    h[0]=(h[0]+a)|0;h[1]=(h[1]+b)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0;
  }
  var out="";
  for(i=0;i<8;i++)out+=("00000000"+(h[i]>>>0).toString(16)).slice(-8);
  return out;
}
async function sha(t){
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
      const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("sg:"+t));
      return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  return sha256Sync("sg:"+t);
}

function closeM(){$("#modal").innerHTML=""}
function createModal(){$("#modal").innerHTML=adminPanel();fillTracks()}
function carOpts(r){const G=CARS[r.game],ks=r.cls&&G[r.cls]?[r.cls]:Object.keys(G);return '<option value="">Выберите машину</option>'+ks.map(k=>'<optgroup label="'+esc(k)+'">'+G[k].map(c=>'<option>'+esc(c)+'</option>').join("")+'</optgroup>').join("")}
function cp(v){(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast("Скопировано"),()=>toast(v))}
function saveLobby(id){const r=mem.races[id];put("races",id,Object.assign({},r,{lobby:$("#lc").value.trim(),spass:$("#lpw").value.trim()}));toast("Сохранено")}
function lobbyCard(id,r,mine,own){
  if(!mine&&!own)return"";
  const st=ts(r.date),open=isNaN(st)||Date.now()>=st-3600000;
  let b;
  if(own)b='<div class="f"><div><label>Код лобби</label><input id="lc" value="'+esc(r.lobby||"")+'"></div><div><label>Пароль сервера</label><input id="lpw" value="'+esc(r.spass||"")+'"></div></div><div style="margin-top:12px"><button class="btn" onclick="saveLobby(\''+id+'\')">Сохранить</button></div><div class="mut" style="margin-top:8px">Участники увидят эти данные за час до старта.</div>';
  else if(!r.lobby&&!r.spass)b='<span class="mut">Организатор ещё не добавил данные лобби.</span>';
  else if(!open)b='<span class="mut">Код лобби и пароль сервера появятся за 1 час до старта — в '+fmt(new Date(st-3600000+10800000).toISOString())+' МСК.</span>';
  else b='<div class="lob"><div class="stat"><span class="mut">Код лобби</span><b>'+esc(r.lobby||"—")+'</b><button class="btn g s" data-v="'+esc(r.lobby||"")+'" onclick="cp(this.dataset.v)">Копировать</button></div><div class="stat"><span class="mut">Пароль сервера</span><b>'+esc(r.spass||"—")+'</b><button class="btn g s" data-v="'+esc(r.spass||"")+'" onclick="cp(this.dataset.v)">Копировать</button></div></div>';
  return '<div class="sh" style="margin-top:0"><h2>Лобби</h2></div><div class="card">'+b+'</div>'
}
function cnt(id){return Object.values(mem.entries).filter(e=>e.race===id).length}
function fmt(d){if(!d)return"";const m=String(d).match(/(\d{4})-(\d\d)-(\d\d)[T ](\d\d:\d\d)/);return m?m[3]+"."+m[2]+"."+m[1]+" "+m[4]:esc(d)}
function dateBlk(r){const m=String(r.date||"").match(/\d{4}-(\d\d)-(\d\d)/);return m?'<div class="db"><b>'+m[2]+'</b><span>'+MON[+m[1]-1]+'</span></div>':'<div class="db"><b>—</b></div>'}
function nextRace(){const rs=Object.entries(mem.races).sort((a,b)=>String(a[1].date||"9").localeCompare(String(b[1].date||"9")));const now=Date.now();return rs.find(([i,r])=>ts(r.date)>now)||rs[0]||null}
function home(){
  const up=nextRace();
  let h='';
  if(up){const id=up[0],r=up[1],c=cnt(id);
    h+='<section class="next"><div><span class="tag '+(r.game==="LMU"?"lmu":"")+'">'+esc(r.game)+'</span>'+(r.cls?' <span class="pill">'+esc(r.cls)+'</span>':"")+'<h1>'+(FLAG[r.track]||"")+' '+esc(r.name)+'</h1><div class="meta"><span>'+esc(r.track)+'</span>'+(r.date?'<span>'+fmt(r.date)+' МСК</span>':"")+(r.dur?'<span>'+esc(r.dur)+' мин</span>':"")+'<span>'+(r.game==="ACC"?"Assetto Corsa Competizione":"Le Mans Ultimate")+'</span></div><div class="row" style="margin-top:22px"><button class="btn" onclick="location.hash=\'race-'+id+'\'">Открыть гонку</button></div></div><div>'+cdHTML(r)+'<div class="bar" style="margin-top:18px"><i style="width:'+Math.min(100,c/r.slots*100)+'%"></i></div><p class="mut" style="margin:8px 0 0">Занято '+c+' из '+r.slots+' мест</p></div></section>';
  } else h+='<section class="next"><div><h1>Здесь появятся гонки</h1><p class="lead">Когда будет создана первая гонка, она окажется на этой странице.</p></div></section>';
  const rs=Object.entries(mem.races).sort((a,b)=>String(a[1].date||"9").localeCompare(String(b[1].date||"9")));
  const gs={};rs.forEach(([id,r])=>{const k=r.cls||"Без класса";(gs[k]=gs[k]||[]).push([id,r])});
  Object.keys(gs).forEach(k=>{h+='<div class="grp"><h3>'+esc(k)+'</h3><span class="mut">'+gs[k].length+'</span></div>'+gs[k].map(([id,r])=>{const c=cnt(id);return '<div class="rrow" onclick="location.hash=\'race-'+id+'\'">'+dateBlk(r)+'<div><div class="rn">'+esc(r.name)+'</div><div class="mut">'+(FLAG[r.track]||"")+' '+esc(r.track)+(r.date?', '+fmt(r.date).slice(11)+' МСК':"")+'</div></div><div class="rr"><span class="tag '+(r.game==="LMU"?"lmu":"gray")+'">'+esc(r.game)+'</span><div class="fill"><div class="bar"><i style="width:'+Math.min(100,c/r.slots*100)+'%"></i></div><div class="mut">'+c+' из '+r.slots+'</div></div></div></div>'}).join("")});
  $("#app").innerHTML=h;
  updateCountdown();
}
function adminPanel(){
  return '<div class="modal" onclick="if(event.target===this)closeM()"><div class="card wide"><div class="row sp"><b style="font-size:17px">Создать гонку</b><button class="btn g s" onclick="closeM()">✕</button></div><div class="f" style="margin-top:10px"><div><label>Название</label><input id="rn" placeholder="Например, 75 Minutes in Imola"></div><div><label>Игра</label><select id="rg" onchange="fillTracks()"><option>ACC</option><option>LMU</option></select></div><div><label>Класс машин</label><select id="rc"></select></div><div><label>Трасса</label><select id="rt"></select></div><div><label>Кол-во гонщиков</label><input id="rs" type="number" min="2" max="60" value="20"></div><div><label>Практика</label><input id="rp" type="datetime-local"></div><div><label>Брифинг</label><input id="rb" type="datetime-local"></div><div><label>Квалификация</label><input id="rq" type="datetime-local"></div><div><label>Гонка</label><input id="rd" type="datetime-local"></div><div><label>Длительность, мин</label><input id="rdur" type="number" min="5" value="60"></div><div><label>Ссылка на racecontrol.gg</label><input id="rl" placeholder="https://racecontrol.gg/…"></div><div><label>Код лобби</label><input id="rlb" placeholder="Можно добавить позже"></div><div><label>Пароль сервера</label><input id="rsp" placeholder="Можно добавить позже"></div></div><div style="margin-top:12px"><button class="btn" onclick="mkRace()">Создать гонку</button></div></div></div>';
}
function fillTracks(){const g=$("#rg"),t=$("#rt"),c=$("#rc");if(!g||!t||!c)return;const ct=t.value,cc=c.value;t.innerHTML=TRACKS[g.value].map(x=>"<option>"+x+"</option>").join("");c.innerHTML=Object.keys(CARS[g.value]).map(x=>"<option>"+esc(x)+"</option>").join("");if(TRACKS[g.value].includes(ct))t.value=ct;if(CARS[g.value][cc])c.value=cc}
function mkRace(){
  const name=$("#rn").value.trim(),slots=parseInt($("#rs").value,10),link=$("#rl").value.trim();
  if(!name)return toast("Введите название");
  if(!(slots>=2))return toast("Укажите количество гонщиков");
  if(link&&!/^https?:\/\//i.test(link))return toast("Ссылка должна начинаться с https://");
  const id=Date.now().toString(36);
  put("races",id,{name:name,game:$("#rg").value,track:$("#rt").value,cls:$("#rc").value,lobby:$("#rlb").value.trim(),spass:$("#rsp").value.trim(),slots:slots,date:$("#rd").value||"",prac:$("#rp").value||"",brief:$("#rb").value||"",quali:$("#rq").value||"",dur:$("#rdur").value||"",link:link,owner:admin,created:Date.now()});
  closeM();rtab="info";location.hash="race-"+id;toast("Гонка создана")
}
let rtab="info";
function setTab(t){rtab=t;render()}
function pilots(){
  const ps=Object.entries(mem.players).sort((a,b)=>(a[1].created||0)-(b[1].created||0));
  $("#app").innerHTML='<div class="sh"><h2>Пилоты</h2><span class="mut">'+ps.length+'</span></div><div class="card tw p0"><table><thead><tr><th>#</th><th>Пилот</th><th>SR</th><th>RC</th><th>Steam</th><th>Гонок</th>'+(admin?'<th>Модерация</th>':"")+'</tr></thead><tbody>'+(ps.length?ps.map(([u,p],i)=>{const b=banInfo(u);return '<tr style="cursor:pointer" onclick="profileModal(\''+u+'\')"><td>'+(i+1)+'</td><td><div class="pl">'+avatarOf(p)+esc(p.nick)+(b?' <span class="tag">бан</span>':"")+'</div>'+(b?'<span class="mut" style="font-size:12px">'+(mem.bans[u].until?"до "+fmtTs(mem.bans[u].until):"навсегда")+' · '+esc(mem.bans[u].reason||"")+'</span>':"")+'</td><td>'+(p.sr?srBadge(p.sr):'<span class="mut">—</span>')+'</td><td>'+(p.rc?esc(rcLetter(p.rc))+" "+esc(p.rc):'<span class="mut">—</span>')+'</td><td class="mut">'+esc(p.steam)+'</td><td>'+racesCount(u)+'</td>'+(admin?'<td><div class="row" onclick="event.stopPropagation()">'+(b?'<button class="btn g s" onclick="unban(\''+u+'\')">Разбанить</button>':'<button class="btn g s" onclick="banModal(\''+u+'\')">Бан</button>')+'</div></td>':"")+'</tr>'}).join(""):'<tr><td colspan="7" class="mut">Пока нет пилотов</td></tr>')+'</tbody></table></div>';
}
function gridViz(r,es){
  const n=Math.min(r.slots,60);let o="";
  for(let i=0;i<n;i++){const e=es[i]&&es[i][1];o+=e?'<div class="slot on"><b>'+esc(e.num)+'</b>'+avatarOf(mem.players[e.uid]||e)+'<span>'+esc(e.name)+'</span>'+srBadge((mem.players[e.uid]||{}).sr||"")+'</div>':'<div class="slot"><i>'+(i+1)+'</i></div>'}
  return '<div class="gv">'+o+'</div>'
}
function raceView(id){
  const r=mem.races[id],es=Object.entries(mem.entries).filter(([k,e])=>e.race===id).sort((a,b)=>(a[1].t||0)-(b[1].t||0)),full=es.length>=r.slots,mine=es.some(([k,e])=>e.uid===uid),own=admin&&r.owner===admin;
  const gname=r.game==="ACC"?"Assetto Corsa Competizione":"Le Mans Ultimate";
  const steps=[["Практика",r.prac],["Брифинг",r.brief],["Квалификация",r.quali],["Гонка",r.date]].filter(x=>x[1]);
  const tl=steps.length?'<ol class="tl">'+steps.map(x=>{const t=ts(x[1]);return '<li class="'+(t<Date.now()?"past":"")+'"><b>'+x[0]+'</b><span>'+fmt(x[1])+' МСК</span></li>'}).join("")+'</ol>':'<p class="mut" style="margin:10px 0 0">Расписание появится, когда его добавит организатор.</p>';
  let h='<a class="crumb" onclick="location.hash=\'\'">← Все гонки</a><div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(0,420px)"><div><div class="row"><span class="tag '+(r.game==="LMU"?"lmu":"")+'">'+esc(r.game)+'</span><span class="pill">'+esc(r.cls||"Все классы")+'</span></div><h1 style="margin-top:14px">'+esc(r.name)+'</h1><div class="meta"><span>'+(FLAG[r.track]||"")+' '+esc(r.track)+'</span>'+(r.date?'<span>'+fmt(r.date)+' МСК</span>':"")+(r.dur?'<span>'+esc(r.dur)+' мин</span>':"")+'<span>'+gname+'</span></div><div class="row" style="margin-top:22px">'+(r.link?'<a class="btn" href="'+esc(r.link)+'" target="_blank" rel="noopener">Открыть на racecontrol.gg ↗</a>':"")+'<button class="btn g" onclick="copyLink()">Скопировать ссылку</button>'+(own?'<button class="btn g" onclick="delRace(\''+id+'\')">Удалить гонку</button>':"")+'</div></div><div>'+cdHTML(r)+'</div></div>';
  h+='<div class="tabs"><a class="'+(rtab==="info"?"on":"")+'" onclick="setTab(\'info\')">Информация</a><a class="'+(rtab==="res"?"on":"")+'" onclick="setTab(\'res\')">Заявки · '+es.length+'</a></div>';
  if(rtab==="info"){
    h+='<div class="cols" style="margin-top:16px"><div><div class="sh" style="margin-top:0"><h2>Стартовая решётка</h2><span class="mut">Занято '+es.length+' из '+r.slots+'</span></div>'+gridViz(r,es)+'</div><div><div class="card"><b>Расписание</b>'+tl+'</div><div style="height:14px"></div>'+lobbyCard(id,r,mine,own)+'</div></div>';
    h+='<div class="card" style="margin-top:20px"><div class="stats"><div class="stat"><span class="mut">Игра</span><b>'+gname+'</b></div><div class="stat"><span class="mut">Трасса</span><b>'+esc(r.track)+'</b></div><div class="stat"><span class="mut">Класс</span><b>'+esc(r.cls||"Все")+'</b></div><div class="stat"><span class="mut">Длительность</span><b>'+(r.dur?esc(r.dur)+" мин":"—")+'</b></div><div class="stat"><span class="mut">Гонщики</span><b>'+es.length+' из '+r.slots+'</b></div><div class="stat"><span class="mut">Свободно мест</span><b>'+Math.max(0,r.slots-es.length)+'</b></div></div></div>';
  }else{
    h+='<div class="cols" style="margin-top:16px;grid-template-columns:minmax(0,1fr) minmax(0,340px)"><div><div class="sh" style="margin-top:0"><h2>Список заявок</h2><span class="mut">'+es.length+' из '+r.slots+'</span></div><div class="card tw p0"><table><thead><tr><th>Поз</th><th>#</th><th>Пилот</th><th>Машина</th><th>Ливрея</th>'+(own||mine?'<th></th>':"")+'</tr></thead><tbody>'+(es.length?es.map(([k,e],i)=>{const pl=mem.players[e.uid]||{};return '<tr'+(pl.nick?' style="cursor:pointer" onclick="profileModal(\''+e.uid+'\')"':"")+'><td><b>'+(i+1)+'</b></td><td><span class="num">'+esc(e.num)+'</span></td><td><div class="pl">'+avatarOf(pl.nick?pl:e)+esc(e.name)+ratingBadges(pl)+'</div></td><td>'+esc(e.car)+'</td><td class="mut">'+esc(e.livery||"—")+'</td>'+(own||e.uid===uid?'<td><button class="btn g s" onclick="event.stopPropagation();del(\'entries\',\''+k+'\')">Убрать</button></td>':(own||mine?'<td></td>':""))+'</tr>'}).join(""):'<tr><td colspan="6" class="mut">Пока никто не записался. Станьте первым.</td></tr>')+'</tbody></table></div></div><div><div class="sh" style="margin-top:0"><h2>Запись на гонку</h2></div><div class="card">'+(mine?'<span class="mut">Вы уже записаны на эту гонку.</span>':full?'<span class="mut">Все места заняты.</span>':'<div class="f" style="grid-template-columns:1fr 1fr"><div><label>Номер машины</label><input id="en" type="number" min="1" max="999"></div><div><label>Гонщик</label><input value="'+esc(me().nick)+'" disabled></div><div style="grid-column:1/-1"><label>Машина</label><select id="ec">'+carOpts(r)+'</select></div><div style="grid-column:1/-1"><label>Ливрея</label><input id="el" placeholder="Название или описание"></div></div><div style="margin-top:16px"><button class="btn" onclick="reg(\''+id+'\')">Записаться</button></div>')+'</div></div></div>';
  }
  $("#app").innerHTML=h;
  updateCountdown();
}
function reg(rid){
  const r=mem.races[rid],p=me(),num=parseInt($("#en").value,10),car=$("#ec").value,livery=$("#el").value.trim();
  if(!(num>=1))return toast("Укажите номер машины");
  if(!car)return toast("Выберите машину");
  if(cnt(rid)>=r.slots)return toast("Мест нет");
  if(Object.values(mem.entries).some(e=>e.race===rid&&e.uid===uid))return toast("Вы уже зарегистрированы");
  const k=rid+"-"+num;
  if(mem.entries[k])return toast("Номер "+num+" уже занят");
  put("entries",k,{race:rid,uid:uid,num:num,name:p.nick,car:car,livery:livery,t:Date.now()});toast("Вы в списке!")
}
function delRace(id){if(!confirm("Удалить гонку и всех участников?"))return;Object.entries(mem.entries).forEach(([k,e])=>{if(e.race===id)del("entries",k,true)});del("races",id);location.hash=""}
function copyLink(){const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast("Ссылка скопирована"),()=>toast(u))}
init();
</script>
</body>
</html>
